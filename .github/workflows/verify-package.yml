name: Verify packaged CLI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/versioned-core-packages]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run build
        env:
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
      - run: npm test
