name: Check Windows launcher arguments

on:
  push:
    branches: [codex/desktop-cli-artifacts]
    paths: [scripts/package-desktop.py, scripts/windows-utf8.manifest, .github/workflows/windows-launcher.yml]
  pull_request:
    paths: [scripts/package-desktop.py, scripts/windows-utf8.manifest]

permissions:
  contents: read

jobs:
  arguments:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Package and run a Unicode argument probe
        shell: pwsh
        run: |
          mkdir classes, jars
          'package com.deadliner.cli; public class MainKt { public static void main(String[] args) { System.out.print(args[0]); } }' | Set-Content MainKt.java
          javac -d classes MainKt.java
          jar cf jars/deadliner-cli.jar -C classes .
          python scripts/package-desktop.py jars dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -c "import subprocess; value='任务 🚀'; assert subprocess.check_output(['dist/deadliner/deadliner.exe',value]).decode('utf-8') == value"
