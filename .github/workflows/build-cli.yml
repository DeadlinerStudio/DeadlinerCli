name: Build CLI prototype
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: cli-prototype-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: cli
      - uses: actions/checkout@v4
        with:
          repository: DeadlinerStudio/DeadlinerCore
          ref: 7ce16d278753e8550b0e40a7483f4ad2170dfdfd
          path: core
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bootstrap Kotlin/Native on the clean runner
        working-directory: core
        run: ./gradlew -PlifiMode=stub :shared:downloadKotlinNativeDistribution --console=plain
      - name: Build native executables
        working-directory: cli
        env:
          DEADLINER_CORE_DIR: ${{ github.workspace }}/core
        run: sh scripts/build.sh
      - name: Run CLI and server integration tests
        working-directory: cli
        run: |
          python3 tests/integration.py
          python3 tests/serve.py
      - name: Pack verified executables
        working-directory: cli
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - uses: actions/upload-artifact@v4
        with:
          name: deadliner-cli-arm64
          path: ${{ runner.temp }}/deadlinerstudio-cli-*.tgz
          if-no-files-found: error
